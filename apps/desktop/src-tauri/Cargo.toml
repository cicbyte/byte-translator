[package]
name = "byte-translator-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "byte-translator 桌面端（Tauri v2）"

[lib]
name = "byte_translator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
byte-translator-core = { path = "../../../crates/core", features = ["server", "mcp"] }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tokio-util = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2"
webbrowser = "1"
enigo = "0.6.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
